services:
  trackcast:
    build: .
    restart: unless-stopped
    init: true
    user: "${TRACKCAST_UID:-10001}:${TRACKCAST_GID:-10001}"
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
